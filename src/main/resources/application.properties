spring.application.name=newsroom

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/newsroom}
spring.datasource.username=${DB_USERNAME:newsroom_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080